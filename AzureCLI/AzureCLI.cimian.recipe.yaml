Description: Downloads the latest Azure CLI MSI installer (x64) and imports into Cimian.
Identifier: com.github.autopkg.cimian.AzureCLI
MinimumVersion: "2.7.0"
Input:
  NAME: AzureCLI
  ARCHITECTURE: x64

Process:
  - Processor: URLDownloader
    Arguments:
      url: "https://aka.ms/installazurecliwindowsx64"
      filename: "%NAME%-%ARCHITECTURE%.msi"

  - Processor: EndOfCheckPhase

  - Processor: CimianInfoCreator
    Arguments:
      pkg_path: "%pathname%"
      installer_type: msi
      cimian_info_name: "%NAME%"
      cimian_info_category: Development
      cimian_info_developer: Microsoft Corporation
      cimian_info_icon_name: "%NAME%.png"
      cimian_info_description: >
        The Azure CLI is a command-line tool for managing Azure resources,
        providing an efficient scripting experience for cloud operations.

  - Processor: CimianImporter
    Arguments:
      pkg_path: "%pathname%"
      installer_type: msi
      cimian_subdirectory: apps/dev
      supported_architectures:
        - x64
        - arm64
      catalogs:
        - Development
        - Testing
      unattended_install: true
      unattended_uninstall: true
