Description: Downloads the latest Microsoft Edge Enterprise MSI (x64) and imports into Cimian.
Identifier: com.github.autopkg.cimian.Edge-x64
MinimumVersion: "2.7.0"
Input:
  NAME: Edge
  ARCHITECTURE: x64

Process:
  - Processor: URLTextSearcher
    Arguments:
      url: https://edgeupdates.microsoft.com/api/products?view=enterprise
      re_pattern: '"Location":"(?P<match>https://[^"]*MicrosoftEdgeEnterpriseX64\.msi)"'
      result_output_var_name: msi_url

  - Processor: URLDownloader
    Arguments:
      url: "%msi_url%"
      filename: "%NAME%-%ARCHITECTURE%.msi"

  - Processor: EndOfCheckPhase

  - Processor: CimianInfoCreator
    Arguments:
      pkg_path: "%pathname%"
      installer_type: msi
      cimian_info_name: "%NAME%"
      cimian_info_category: Browsers
      cimian_info_developer: Microsoft Corporation
      cimian_info_icon_name: "%NAME%.png"
      cimian_info_description: >
        Microsoft Edge Enterprise is the Chromium-based web browser from
        Microsoft, packaged as an MSI for machine-wide deployment and
        Group Policy management.

  - Processor: CimianImporter
    Arguments:
      pkg_path: "%pathname%"
      installer_type: msi
      cimian_subdirectory: apps/browsers
      supported_architectures:
        - "%ARCHITECTURE%"
      catalogs:
        - Development
        - Testing
      blocking_applications:
        - msedge
      unattended_install: true
      unattended_uninstall: false
