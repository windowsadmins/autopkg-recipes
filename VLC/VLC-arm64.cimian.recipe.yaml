Description: Downloads the latest VLC installer (arm64) and imports into Cimian.
Identifier: com.github.autopkg.cimian.VLC-arm64
MinimumVersion: "2.7.0"
Input:
  NAME: VLC
  DOWNLOAD_URL: https://get.videolan.org/vlc/last/winarm64/
  ARCHITECTURE: arm64

Process:
  - Processor: URLTextSearcher
    Arguments:
      url: "%DOWNLOAD_URL%"
      re_pattern: 'vlc-[\d.]+-winarm64\.exe'
      result_output_var_name: vlc_filename

  - Processor: URLDownloader
    Arguments:
      url: "%DOWNLOAD_URL%%vlc_filename%"
      filename: "%NAME%-%ARCHITECTURE%.exe"

  - Processor: EndOfCheckPhase

  - Processor: CimianInfoCreator
    Arguments:
      pkg_path: "%pathname%"
      installer_type: exe
      cimian_info_name: "%NAME%"
      cimian_info_category: Video
      cimian_info_developer: VideoLAN
      cimian_info_icon_name: "%NAME%.png"
      cimian_info_description: >
        VLC is a free and open source cross-platform multimedia player and framework
        that plays most multimedia files as well as DVDs, Audio CDs, VCDs, and
        various streaming protocols.

  - Processor: CimianImporter
    Arguments:
      pkg_path: "%pathname%"
      installer_type: exe
      cimian_subdirectory: apps/video
      installer_switches:
        - /S
        - /NCRC
        - "D=C:\\Program Files\\VideoLAN\\VLC"
      supported_architectures:
        - "%ARCHITECTURE%"
      catalogs:
        - Development
        - Testing
      unattended_install: true
      unattended_uninstall: true
      postinstall_script: |
        $shortcutPattern = 'C:\Users\Public\Desktop\VLC*.lnk'
        $matchingShortcuts = Get-ChildItem -Path $shortcutPattern -ErrorAction SilentlyContinue
        foreach ($shortcut in $matchingShortcuts) {
          Remove-Item $shortcut.FullName -Force -ErrorAction SilentlyContinue
        }
