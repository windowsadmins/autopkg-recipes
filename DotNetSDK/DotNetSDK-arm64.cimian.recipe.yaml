Description: Downloads the latest .NET 10 SDK installer (arm64) and imports into Cimian.
Identifier: com.github.autopkg.cimian.DotNetSDK-arm64
MinimumVersion: "2.7.0"
Input:
  NAME: DotNetSDK
  CHANNEL: "10.0"
  ARCHITECTURE: arm64

Process:
  - Processor: URLDownloader
    Arguments:
      url: "https://aka.ms/dotnet/%CHANNEL%/dotnet-sdk-win-arm64.exe"
      filename: "%NAME%-%ARCHITECTURE%.exe"

  - Processor: EndOfCheckPhase

  - Processor: CimianInfoCreator
    Arguments:
      pkg_path: "%pathname%"
      installer_type: exe
      cimian_info_name: "%NAME%"
      cimian_info_category: Development
      cimian_info_developer: Microsoft Corporation
      cimian_info_icon_name: "%NAME%.png"
      cimian_info_description: >
        The .NET SDK is a cross-platform development environment for building
        .NET applications, including the runtime, libraries, and tooling.

  - Processor: CimianImporter
    Arguments:
      pkg_path: "%pathname%"
      installer_type: exe
      cimian_subdirectory: apps/dev
      installer_switches:
        - /install
        - /quiet
        - /norestart
      supported_architectures:
        - "%ARCHITECTURE%"
      catalogs:
        - Development
        - Testing
      unattended_install: true
      unattended_uninstall: true
