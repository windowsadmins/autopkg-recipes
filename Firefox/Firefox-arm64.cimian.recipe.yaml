Description: Downloads the latest Firefox installer (arm64) and imports into Cimian. Mozilla only ships an EXE for Windows-on-ARM; there is no arm64 MSI.
Identifier: com.github.autopkg.cimian.Firefox-arm64
MinimumVersion: "2.7.0"
Input:
  NAME: Firefox
  DOWNLOAD_URL: "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64-aarch64&lang=en-US"
  ARCHITECTURE: arm64

Process:
  # The Mozilla EXE installer stub reports its own internal FileVersion
  # (~18.x), NOT the real Firefox version. Fetch the actual latest version
  # from Mozilla's product-details endpoint and pass it in explicitly via
  # cimian_info_version so CimianInfoCreator does not read it from the EXE.
  - Processor: URLTextSearcher
    Arguments:
      url: https://product-details.mozilla.org/1.0/firefox_versions.json
      re_pattern: '"LATEST_FIREFOX_VERSION":\s*"(?P<version>[0-9]+(?:\.[0-9]+)+)"'
      result_output_var_name: version

  - Processor: URLDownloader
    Arguments:
      url: "%DOWNLOAD_URL%"
      filename: "%NAME%-%ARCHITECTURE%.exe"

  - Processor: EndOfCheckPhase

  - Processor: CimianInfoCreator
    Arguments:
      pkg_path: "%pathname%"
      installer_type: exe
      cimian_info_name: "%NAME%"
      cimian_info_version: "%version%"
      cimian_info_category: Browsers
      cimian_info_developer: Mozilla
      cimian_info_icon_name: "%NAME%.png"
      cimian_info_description: >
        Firefox is a free and open-source web browser developed by Mozilla,
        focused on privacy, security, and customization.

  - Processor: CimianImporter
    Arguments:
      pkg_path: "%pathname%"
      installer_type: exe
      cimian_subdirectory: apps/browsers
      installer_switches:
        - /S
      supported_architectures:
        - "%ARCHITECTURE%"
      catalogs:
        - Development
        - Testing
      blocking_applications:
        - firefox
      unattended_install: true
      unattended_uninstall: true
