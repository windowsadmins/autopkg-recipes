Description: Downloads the latest Cyberduck MSI installer (x64) and imports into Cimian.
Identifier: com.github.autopkg.cimian.Cyberduck-x64
MinimumVersion: "2.7.0"
Input:
  NAME: Cyberduck
  ARCHITECTURE: x64

Process:
  # iterate-ch/cyberduck exists but does not publish GitHub releases (API 404);
  # the MSI is served from update.cyberduck.io and linked from the changelog.
  - Processor: URLTextSearcher
    Arguments:
      url: https://cyberduck.io/changelog/
      re_pattern: '(?P<match>https://update\.cyberduck\.io/windows/Cyberduck-Installer-[\d.]+\.msi)'
      result_output_var_name: cyberduck_msi_url

  - Processor: URLDownloader
    Arguments:
      url: "%cyberduck_msi_url%"
      filename: "%NAME%-%ARCHITECTURE%.msi"

  - Processor: EndOfCheckPhase

  - Processor: CimianInfoCreator
    Arguments:
      pkg_path: "%pathname%"
      installer_type: msi
      cimian_info_name: "%NAME%"
      cimian_info_category: Utilities
      cimian_info_developer: iterate GmbH
      cimian_info_icon_name: "%NAME%.png"
      cimian_info_description: >
        Cyberduck is an open-source client for FTP and SFTP, WebDAV, and
        cloud storage, available for Windows licensed under the GPL.

  - Processor: CimianImporter
    Arguments:
      pkg_path: "%pathname%"
      installer_type: msi
      cimian_subdirectory: apps/utilities
      supported_architectures:
        - "%ARCHITECTURE%"
      catalogs:
        - Development
        - Testing
      unattended_install: true
      unattended_uninstall: false
